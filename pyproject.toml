[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-android"
version = "0.4.6"
description = "Secure Android package inspection, decompilation, and rebuilding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "APEX Contributors" }]
dependencies = [
    "androguard>=4.1.4",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
postgres = ["psycopg[binary]>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.16.1",
    "fastmcp>=2.0",
]

[project.scripts]
apex = "apex:main"

[tool.setuptools.packages.find]
include = ["apex*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
