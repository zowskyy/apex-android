plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "io.apex.standalone"
    compileSdk 34

    defaultConfig {
        applicationId "io.apex.standalone"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "0.4.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.10"
        buildPython "python3.10"
        extractPackages "apex", "androguard"
        pip {
            options("--constraint", "chaquopy-constraints.txt")
            install "androguard==4.1.4"
            install "jinja2>=3.1.0"
            install "lxml>=4.9.0"
            install "asn1crypto>=1.5.0"
            install "networkx>=3.0"
            install "click>=8.0"
            install "colorama>=0.4"
            install "pyyaml>=6.0"
        }
    }
    sourceSets {
        getByName("main") {
            srcDir("../../../")
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
}
