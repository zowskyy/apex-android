name: Android standalone APK

on:
  push:
    branches: [master, main, "cursor/**"]
    paths:
      - "wrappers/android/standalone/**"
      - "wrappers/android/build_standalone.sh"
      - "apex/**"
      - ".github/workflows/android-standalone.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build APEX standalone APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x wrappers/android/build_standalone.sh
          bash wrappers/android/build_standalone.sh
          ls -la wrappers/android/dist/apex-mobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-mobile-apk
          path: wrappers/android/dist/apex-mobile.apk
          if-no-files-found: error
