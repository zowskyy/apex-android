name: Monitor Gates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check gate failure rate from audit log
        run: |
          pip install -e .
          python <<'PY'
          import os
          from apex.gate.audit_log import AuditLogger

          rate = AuditLogger().failure_rate()
          threshold = float(os.environ.get("APEX_GATE_FAILURE_THRESHOLD", "0.05"))
          print(f"recent failure rate: {rate:.2%} (threshold {threshold:.0%})")
          if rate > threshold:
              raise SystemExit(f"gate failure rate {rate:.2%} exceeds {threshold:.0%}")
          PY
