name: Android client APK

on:
  push:
    branches: [master, main, "cursor/**"]
    paths:
      - "wrappers/android/**"
      - "tools/mobile_test_app/inject_dex.py"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build APEX client APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          APEX_BUILD_TOOLS: "34.0.0"
          APEX_ANDROID_PLATFORM: android-34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          bash wrappers/android/build.sh
          ls -la wrappers/android/dist/apex-client.apk

      - name: Package companion artifact with README
        run: |
          cat > wrappers/android/dist/WHICH_APK.txt << 'EOF'
          ========================================
          APEX COMPANION APK (apex-client.apk)
          ========================================
          This is NOT the full on-phone engine.
          App name on phone: "APEX Companion"
          Menu item: "Server URL"

          You need a PC on the same Wi-Fi running:
            apex mobile

          Then set Server URL to e.g. http://192.168.1.42:8765

          FOR ON-DEVICE ANALYSIS (no PC):
          GitHub Actions -> "Android standalone APK"
          Download artifact: apex-mobile-apk
          Install apex-mobile.apk (app name: APEX Mobile)
          EOF
          cd wrappers/android/dist
          zip -j apex-companion-client-apk.zip apex-client.apk WHICH_APK.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-companion-client-apk-NEEDS-PC-SERVER
          path: wrappers/android/dist/apex-companion-client-apk.zip
          if-no-files-found: error
