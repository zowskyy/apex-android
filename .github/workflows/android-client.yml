name: Android client APK

on:
  push:
    branches: [master, main, "cursor/**"]
    paths:
      - "wrappers/android/**"
      - "tools/mobile_test_app/inject_dex.py"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build APEX client APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          APEX_BUILD_TOOLS: "34.0.0"
          APEX_ANDROID_PLATFORM: android-34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          bash wrappers/android/build.sh
          ls -la wrappers/android/dist/apex-client.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-client-apk
          path: wrappers/android/dist/apex-client.apk
          if-no-files-found: error
