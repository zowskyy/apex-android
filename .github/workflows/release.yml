name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.4.1) — used only for manual dry-run artifact names"
        required: true
        default: "0.4.1"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build APEX Mobile APK and AAB
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x wrappers/android/build_standalone.sh
          bash wrappers/android/build_standalone.sh
          cd wrappers/android/standalone
          ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/

      - name: Package Android release files
        run: |
          chmod +x scripts/package_android_release.sh
          bash scripts/package_android_release.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-staging/android/*
          if-no-files-found: error

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Linux desktop bundle
        run: |
          chmod +x scripts/package_desktop_release.sh
          bash scripts/package_desktop_release.sh "${{ steps.ver.outputs.version }}" linux

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: release-staging/APEX-*-linux-x64.tar.gz
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Windows desktop bundle
        shell: bash
        run: |
          chmod +x scripts/package_desktop_release.sh
          bash scripts/package_desktop_release.sh "${{ steps.ver.outputs.version }}" windows
          STAGE="release-staging/APEX-${{ steps.ver.outputs.version }}-windows-x64"
          powershell -Command "Compress-Archive -Path '$STAGE' -DestinationPath 'release-staging/APEX-${{ steps.ver.outputs.version }}-windows-x64.zip' -Force"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: release-staging/APEX-*-windows-x64.zip
          if-no-files-found: error

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package macOS desktop bundle
        run: |
          chmod +x scripts/package_desktop_release.sh
          bash scripts/package_desktop_release.sh "${{ steps.ver.outputs.version }}" macos

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: release-staging/APEX-*-macos.zip
          if-no-files-found: error

  publish:
    needs: [android, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: find dist -type f -ls

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: APEX v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: scripts/release/RELEASE_NOTES.md
          files: |
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
